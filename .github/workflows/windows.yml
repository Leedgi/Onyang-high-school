name: Windows setup and OCR checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_photos:
        description: "업로드한 실제 사진 42장 전체 검사"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: ${{ github.event.inputs.all_photos == 'true' && 60 || 25 }}
    defaults:
      run:
        shell: cmd
        working-directory: project with spaces
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          path: project with spaces
      - name: Install the previous Python for an upgrade test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Create an existing Python 3.12 environment
        run: |
          python -m venv .venv
          echo preserved-from-312> .venv\upgrade-marker.txt
      - name: Install the supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            project with spaces/requirements.txt
            project with spaces/requirements-windows.txt
      - name: Install using the Windows setup entry point
        run: setup_windows.bat --no-pause
      - name: Verify the Python upgrade preserves the previous environment
        run: |
          .venv\Scripts\python.exe --version
          python -c "from pathlib import Path; import subprocess; backups=list(Path('.venv-backups').iterdir()); assert len(backups)==1; assert (backups[0]/'upgrade-marker.txt').is_file(); subprocess.run([str(backups[0]/'Scripts/python.exe'),'-c','import sys; assert sys.version_info[:2]==(3,12)'],check=True)"
          python scripts\setup_windows_env.py
          python -c "from pathlib import Path; assert len(list(Path('.venv-backups').iterdir()))==1"
      - name: Verify native Windows recovery from a Python download error
        run: .venv\Scripts\python.exe -m scripts.check_model_download
      - name: Verify model-only retry reuses the installed models
        run: retry_ocr_windows.bat --no-pause
      - name: Run tests, real CPU OCR, and server checks
        run: check_windows.bat --no-pause
      - name: Check uploaded real photos on Windows CPU
        if: github.event.inputs.all_photos != 'true'
        run: .venv\Scripts\python.exe -m scripts.check_real_ocr --files 20261029_224822.jpg 20261029_224910.jpg 20261029_225428.jpg 20261029_225449.jpg 20261029_225517.jpg KakaoTalk_20261030_020321444_12.jpg
      - name: Check all uploaded photos on Windows CPU
        if: github.event.inputs.all_photos == 'true'
        run: .venv\Scripts\python.exe -m scripts.check_real_ocr --workers 2
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-check-reports
          path: project with spaces/artifacts/
          if-no-files-found: ignore
